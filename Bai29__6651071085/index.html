<!DOCTYPE html> 
<html lang="en">
    <head> 
        <meta charset=utf-8 /> 
        <title>Return first and last name from a form</title> 
    </head>
<body> 
    <form id="form1" onsubmit="getFormvalue()"> 
        First name: <input type="text" name="fname" value="David"><br> 
        Last name: <input type="text" name="lname" value="Beckham"><br> 
        <input type="submit" value="Submit"> 
    </form> 
    <script>    
        //Áp dụng DOM để lấy ra giá trị Họ và tên từ hai input form. 
        function getFormValue(){
            var x = document.forms["form1"]["fname"].value; 
            var y = document.forms["form1"]["lname"].value; 
            alert("First name: " + x + "\nLast name: " + y);
        }
    </script>
</body> 
</html>
